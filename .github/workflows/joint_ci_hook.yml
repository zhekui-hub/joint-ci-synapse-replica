name: Joint CI participant replica

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      joint_id:
        required: false
        default: replica-manual
      joint_wait:
        required: false
        default: 'true'
      depends_on_json:
        required: false
        default: '{}'

permissions:
  contents: read
  statuses: write

jobs:
  independent-contract:
    name: Independent contract [simulated]
    runs-on: [self-hosted, replica-synapse]
    strategy:
      fail-fast: false
      matrix:
        case: [default, negative-contract]
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: joint_ci_hook
      REPLICA_SOURCE_JOB: independent-contract
      REPLICA_SCOPE: private
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 ci_sim/runner.py

  joint-report:
    name: Joint report [simulated]
    needs: independent-contract
    if: ${{ always() }}
    runs-on: [self-hosted, replica-synapse]
    env:
      REPLICA_REPOSITORY: synapse
      JOINT_CI_ID: ${{ inputs.joint_id || github.head_ref || github.ref_name }}
      JOINT_WAIT: ${{ inputs.joint_wait || 'true' }}
      JOINT_DEPS_JSON: ${{ inputs.depends_on_json || '{{}}' }}
      REPLICA_SOURCE_WORKFLOW: joint_ci_hook
      REPLICA_SOURCE_JOB: joint-report
      REPLICA_SCOPE: joint
      REPLICA_EXECUTION_OWNER: arsenal
      JOINT_DISPATCH_TOKEN: ${{ secrets.JOINT_DISPATCH_TOKEN }}
      JOINT_TARGET_REPO: zhekui-hub/joint-ci-arsenal-replica
      GITHUB_TOKEN: ${{ github.token }}
      JOINT_STATUS_CONTEXT: Joint CI readiness
      JOINT_REPORT_ONLY: ${{ inputs.report_only || false }}
      JOINT_MEMBERS_JSON: ${{ inputs.participants_json || '["driver","synapse"]' }}
      GITHUB_HEAD_REF: ${{ github.head_ref || github.ref_name }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 ci_sim/participant_report.py
      - name: Retain participant report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: joint-report
          path: joint-report.json
          if-no-files-found: error
