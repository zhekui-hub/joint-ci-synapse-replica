name: AI Code Review (PR-Agent) [replica dry-run]
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: acfe7ff8b51d2fe6391301af0eb5b159720f3a21
  REPLICA_TEST_MODE: dry-run
jobs:
  pr-agent-event:
    name: pr-agent-event [simulated]
    if: ${{ always() }}
    runs-on:
    - self-hosted
    - replica-synapse
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ai_code_review.yml
      REPLICA_SOURCE_JOB: pr-agent-event
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
  pr-agent-dispatch:
    name: pr-agent-dispatch [simulated]
    if: ${{ always() }}
    runs-on:
    - self-hosted
    - replica-synapse
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ai_code_review.yml
      REPLICA_SOURCE_JOB: pr-agent-dispatch
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
