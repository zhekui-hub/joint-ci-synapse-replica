name: AI Code Review (PR-Agent) [replica dry-run]
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number
      simulate_failure:
        description: Fail one simulated job by id/workflow/repo, or all
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: be4dd338979bbab8c628ec1ee58aadc47d7d2567
  REPLICA_TEST_MODE: dry-run
  REPLICA_RUNNER_LABEL: grok-box
jobs:
  pr-agent-event:
    name: pr-agent-event [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ai_code_review.yml
      REPLICA_SOURCE_JOB: pr-agent-event
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
  pr-agent-dispatch:
    name: pr-agent-dispatch [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ai_code_review.yml
      REPLICA_SOURCE_JOB: pr-agent-dispatch
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
