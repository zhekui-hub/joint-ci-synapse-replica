name: Joint CI public summary

'on':
  repository_dispatch:
    types: [joint_ci_public_summary]
  workflow_dispatch:
    inputs:
      payload:
        description: JSON payload for a manual summary update
        required: true
        type: string

permissions:
  contents: read
  checks: write

concurrency:
  # Do not put the full JSON input in the concurrency key. It can exceed the
  # group-length limit and makes two updates for the same joint independent.
  group: joint-ci-summary-${{ github.event.client_payload.joint_key || github.run_id }}-${{ github.event.client_payload.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror shared checks
    runs-on: [self-hosted, grok-box]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      JOINT_CHECK_PAYLOAD: ${{ inputs.payload || toJson(github.event.client_payload) }}
    steps:
      - uses: actions/checkout@v5
      - name: Publish one native Check Run per shared test
        run: python3 ci_sim/mirror_joint_checks.py
