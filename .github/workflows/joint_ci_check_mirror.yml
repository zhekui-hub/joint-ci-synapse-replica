name: Joint CI public summary

'on':
  repository_dispatch:
    types: [joint_ci_public_summary]
  workflow_dispatch:
    inputs:
      payload:
        description: JSON payload for a manual summary update
        required: true
        type: string

permissions:
  contents: read
  checks: write

jobs:
  mirror:
    name: mirror shared checks
    runs-on: [self-hosted, grok-box]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      JOINT_CHECK_PAYLOAD: ${{ inputs.payload || toJson(github.event.client_payload) }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish aggregate shared matrix Check Run
        run: python3 ci_sim/summary_joint_check.py
