name: DLCSynapse build Custom Kernel [replica dry-run]
'on':
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: acfe7ff8b51d2fe6391301af0eb5b159720f3a21
  REPLICA_TEST_MODE: dry-run
jobs:
  build_DLCSynapse:
    name: build_DLCSynapse [simulated]
    if: ${{ always() }}
    runs-on:
    - self-hosted
    - replica-synapse
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: custom_kernel_build.yml
      REPLICA_SOURCE_JOB: build_DLCSynapse
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
