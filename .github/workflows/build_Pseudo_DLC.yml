name: DLCSynapse build on pseudo dlc [replica dry-run]
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: acfe7ff8b51d2fe6391301af0eb5b159720f3a21
  REPLICA_TEST_MODE: dry-run
jobs:
  call-arsenal-pseudo-test:
    name: call-arsenal-pseudo-test [simulated]
    if: ${{ always() }}
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: build_Pseudo_DLC.yml
      REPLICA_SOURCE_JOB: call-arsenal-pseudo-test
      REPLICA_SCOPE: shared-arsenal
      REPLICA_EXECUTION_OWNER: arsenal
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
