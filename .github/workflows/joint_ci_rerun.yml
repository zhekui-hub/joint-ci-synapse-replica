# Author: zhekui. Short participant relay for the isolated Actions-only trial.
# sync/pending mirror verified source jobs; other operations request a rerun.
name: Joint CI Actions relay
run-name: No App relay ${{ inputs.operation }} ${{ inputs.source_run_id }} ${{ inputs.expected_attempt }}

'on':
  push:
    branches: [zhekui/feat-no-app-demo-20260930]
  workflow_dispatch:
    inputs:
      operation:
        description: Synchronize checks or request an Arsenal rerun
        required: true
        type: choice
        default: sync
        options: [sync, pending, failed, all, build, unit, integration]
      source_run_id:
        description: Arsenal Actions source run ID
        required: true
        type: string
      expected_attempt:
        description: Current source run attempt (rejects stale requests)
        required: true
        default: '1'
        type: string

permissions:
  contents: read
  checks: write

concurrency:
  group: joint-actions-relay-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  relay:
    name: sync or rerun shared tests
    runs-on: [self-hosted, grok-box]
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      JOINT_DISPATCH_TOKEN: ${{ secrets.JOINT_DISPATCH_TOKEN }}
      JOINT_RELAY_INPUTS: ${{ toJson(inputs) }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify source and update this repository
        run: python3 ci_sim/actions_relay.py
