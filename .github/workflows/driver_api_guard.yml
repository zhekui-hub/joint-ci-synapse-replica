name: Driver API Guard [replica dry-run]
'on':
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail one simulated job by id/workflow/repo, or all
        required: false
        default: ''
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: be4dd338979bbab8c628ec1ee58aadc47d7d2567
  REPLICA_TEST_MODE: dry-run
  REPLICA_RUNNER_LABEL: grok-box
jobs:
  driver_api_guard:
    name: Check Synapse API change window [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: driver_api_guard.yml
      REPLICA_SOURCE_JOB: driver_api_guard
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
  refresh_open_pr_guards:
    name: Refresh open PR API guards [simulated]
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: driver_api_guard.yml
      REPLICA_SOURCE_JOB: refresh_open_pr_guards
      REPLICA_SCOPE: private
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
