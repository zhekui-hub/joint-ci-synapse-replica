name: Synapse PR CI Router [replica dry-run]
'on':
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - edited
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: acfe7ff8b51d2fe6391301af0eb5b159720f3a21
  REPLICA_TEST_MODE: dry-run
jobs:
  route:
    name: route [simulated]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on:
    - self-hosted
    - replica-synapse
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: route
      REPLICA_SCOPE: shared-arsenal
      REPLICA_EXECUTION_OWNER: arsenal
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
  prechecks:
    name: prechecks [simulated]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on:
    - self-hosted
    - replica-synapse
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: prechecks
      REPLICA_SCOPE: shared-arsenal
      REPLICA_EXECUTION_OWNER: arsenal
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
  run_arc_multirepo:
    name: run_arc_multirepo [simulated]
    needs:
    - route
    - prechecks
    if: ${{ github.event_name != 'pull_request' }}
    runs-on:
    - self-hosted
    - replica-synapse
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: run_arc_multirepo
      REPLICA_SCOPE: shared-arsenal
      REPLICA_EXECUTION_OWNER: arsenal
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
  run_driver_multirepo:
    name: run_driver_multirepo [simulated]
    needs:
    - route
    - prechecks
    if: ${{ github.event_name != 'pull_request' }}
    runs-on:
    - self-hosted
    - replica-synapse
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: run_driver_multirepo
      REPLICA_SCOPE: shared-arsenal
      REPLICA_EXECUTION_OWNER: arsenal
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
  run_pseudo:
    name: run_pseudo [simulated]
    needs:
    - route
    - prechecks
    if: ${{ github.event_name != 'pull_request' }}
    runs-on:
    - self-hosted
    - replica-synapse
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: run_pseudo
      REPLICA_SCOPE: shared-arsenal
      REPLICA_EXECUTION_OWNER: arsenal
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
  aggregate:
    name: Synapse CI aggregate [simulated]
    needs:
    - route
    - prechecks
    - run_arc_multirepo
    - run_driver_multirepo
    - run_pseudo
    if: ${{ always() }}
    runs-on:
    - self-hosted
    - replica-synapse
    strategy:
      fail-fast: false
      matrix:
        replica_case:
        - default
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: aggregate
      REPLICA_SCOPE: participant-aggregate
      REPLICA_EXECUTION_OWNER: participant
      REPLICA_ALLOW_SKIPPED_NEEDS: 'true'
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || ''
        }}
      MATRIX_JSON: ${{ toJson(matrix) }}
    steps:
    - name: Simulate source job contract
      shell: python
      run: python ci_sim/runner.py
