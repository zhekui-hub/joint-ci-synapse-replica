name: Synapse PR CI Router [replica dry-run]
'on':
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  REPLICA_SOURCE_SHA: acfe7ff8b51d2fe6391301af0eb5b159720f3a21
  REPLICA_TEST_MODE: dry-run
jobs:
  aggregate:
    name: Synapse CI aggregate [simulated]
    if: ${{ always() }}
    runs-on: [self-hosted, grok-box]
    strategy:
      fail-fast: false
      matrix:
        replica_case: [default]
    env:
      REPLICA_REPOSITORY: synapse
      REPLICA_SOURCE_WORKFLOW: ci_router.yml
      REPLICA_SOURCE_JOB: aggregate
      REPLICA_SCOPE: participant-aggregate
      REPLICA_EXECUTION_OWNER: participant
      REPLICA_ALLOW_SKIPPED_NEEDS: 'true'
      SIMULATE_FAILURE: ${{ inputs.simulate_failure || vars.SIMULATE_FAILURE || '' }}
      MATRIX_JSON: ${{ toJson(matrix) }}
      NEEDS_JSON: ${{ toJson(needs) }}
    steps:
      - name: Simulate participant aggregate contract
        shell: bash
        run: python3 ci_sim/runner.py
