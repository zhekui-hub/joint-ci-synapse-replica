    - name: Checkout replica harness
      uses: actions/checkout@v4
    - name: Simulate source job contract
      shell: bash
      run: python3 ci_sim/runner.py
    needs:
    - route
    - prechecks
  aggregate:
    name: Synapse CI aggregate
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on:
    - self-hosted
    - grok-box
    strategy:
      fail-fast: false
